name: Sherlock Username Search

on:
  workflow_dispatch:
    inputs:
      usernames:
        description: "Space-separated usernames to search"
        required: true
        default: "bradydefibaugh"
        type: string

permissions:
  contents: read

concurrency:
  group: sherlock-search-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  search:
    name: Search social networks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Sherlock
        run: python -m pip install .

      - name: Validate input and run search
        env:
          SEARCH_USERNAMES: ${{ inputs.usernames }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a usernames <<< "$SEARCH_USERNAMES"

          if (( ${#usernames[@]} == 0 || ${#usernames[@]} > 10 )); then
            echo "::error::Provide between 1 and 10 space-separated usernames."
            exit 1
          fi

          for username in "${usernames[@]}"; do
            if [[ ! "$username" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
              echo "::error::Invalid username: $username"
              exit 1
            fi
          done

          mkdir -p results
          cd results
          sherlock "${usernames[@]}" \
            --timeout 20 \
            --print-found \
            --no-color \
            --folderoutput . \
            --csv \
            2>&1 | tee sherlock-console.log

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sherlock search"
            echo
            echo "**Usernames:** \`${{ inputs.usernames }}\`"
            echo
            if [[ -d results ]]; then
              echo "Download the **sherlock-results** artifact for CSV/text output and the console log."
            else
              echo "The search did not produce a results directory. Review the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sherlock-results-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
